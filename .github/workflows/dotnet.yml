name: .NET Build

on:
  push:
    branches: [master, "feature/**"]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore apps/api/OpenIRP.slnx
      - name: Build
        run: dotnet build apps/api/OpenIRP.slnx --no-restore --configuration Release
